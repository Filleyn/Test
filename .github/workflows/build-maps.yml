name: Build map files

on:
  # Built when asked (Actions → Build map files → Run workflow). Each state builds separately,
  # and several can run at once.
  workflow_dispatch:
    inputs:
      region:
        description: "Region to build"
        type: choice
        options:
          - cottonwood-canyon
          - oregon
          - washington
          - idaho
          - california
          - nevada
        default: oregon
      expect_trail:
        description: "Trail name the check report should look for (blank uses the region's default)"
        default: ""
      rebuild:
        description: "What to build"
        type: choice
        options:
          - everything
          - trails only (reuse topo, contours, shading from the last build)
        default: everything

permissions:
  contents: write

concurrency:
  group: build-maps-${{ inputs.region || 'oregon' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REGION: ${{ inputs.region || 'oregon' }}
      # /mnt has far more free space than the runner's main disk.
      WORK: /mnt/work
      OUT: /mnt/out
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Read region settings
        id: region
        env:
          EXPECT: ${{ inputs.expect_trail }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          r = json.load(open("pipeline/regions.json"))[os.environ["REGION"]]
          print("bbox=" + ",".join(str(v) for v in r["bbox"]))
          print("osm=" + r["osm_extract"])
          print("dem_product=" + r["dem_product"])
          print("max_zoom=" + str(r["max_zoom"]))
          print("terrain_max_zoom=" + str(r["terrain_max_zoom"]))
          print("contour_max_zoom=" + str(r.get("contour_max_zoom", 14)))
          print("roads=" + r.get("roads", "all"))
          print("java_heap=" + r.get("java_heap", "6g"))
          print("expect_trail=" + (os.environ.get("EXPECT") or r.get("expect_trail", "")))
          EOF
          sudo mkdir -p "$WORK" "$OUT"
          sudo chown -R "$USER" "$WORK" "$OUT"
          df -h / /mnt

      - name: Install tools
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool gdal-bin build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git "$WORK/tippecanoe"
          make -C "$WORK/tippecanoe" -j"$(nproc)" >/dev/null
          sudo make -C "$WORK/tippecanoe" install >/dev/null
          gh release download --repo onthegomap/planetiler --pattern planetiler.jar --dir "$WORK"
          tippecanoe --version
          osmium --version | head -1
          gdalinfo --version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Download and clip OpenStreetMap data
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          curl -fsSL --retry 3 -o "$WORK/source.osm.pbf" "${{ steps.region.outputs.osm }}"
          osmium extract --strategy complete_ways -b "${{ steps.region.outputs.bbox }}" \
            "$WORK/source.osm.pbf" -o "$WORK/region.osm.pbf" --overwrite
          osmium tags-filter "$WORK/region.osm.pbf" \
            w/highway n/highway=trailhead \
            n/natural=spring,peak,water_point n/amenity=drinking_water,water_point,toilets \
            n/man_made=water_well n/tourism=camp_site,viewpoint,alpine_hut \
            n/waterway=waterfall n/natural=hot_spring,saddle n/mountain_pass=yes n/amenity=shelter \
            n/place=city,town,village,hamlet wr/natural=water wr/landuse=reservoir \
            wr/highway=trailhead wr/tourism=camp_site,viewpoint,alpine_hut wr/amenity=toilets,shelter \
            nwr/amenity=parking w/waterway=waterfall,stream,river,canal wr/natural=hot_spring \
            nwr/tower:type=fire_lookout nwr/man_made=tower nwr/building=fire_lookout nwr/historic=fire_lookout,ruins,archaeological_site,mine,mine_shaft,adit,monument,fort,wreck,homestead,cabin,railway_station \
            r/route=hiking,foot \
            -o "$WORK/filtered.osm.pbf" --overwrite
          osmium fileinfo -e "$WORK/region.osm.pbf" | grep -E "Number of (nodes|ways|relations)" || true

      - name: Get the state outline (for trimming the edges so neighbouring states don't overlap)
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          python3 pipeline/region_poly.py --osm-url "${{ steps.region.outputs.osm }}" --out "$WORK/outline.geojson"

      - name: Download elevation (USGS 3DEP)
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          mkdir -p "$WORK/dem"
          python3 pipeline/dem_tiles.py --bbox="${{ steps.region.outputs.bbox }}" \
            --product "${{ steps.region.outputs.dem_product }}" > "$WORK/dem-urls.txt"
          cat "$WORK/dem-urls.txt"
          while read -r url; do
            # Tiles fully over the ocean don't exist; skip them.
            curl -fsSL --retry 3 -o "$WORK/dem/$(basename "$url")" "$url" || echo "skipped $url"
          done < "$WORK/dem-urls.txt"
          ls -la "$WORK/dem"
          gdalbuildvrt "$WORK/dem.vrt" "$WORK"/dem/*.tif
          IFS=, read -r W S E N <<< "${{ steps.region.outputs.bbox }}"
          gdalwarp -q -overwrite -multi -wo NUM_THREADS=ALL_CPUS -te_srs EPSG:4326 -te "$W" "$S" "$E" "$N" \
            -co COMPRESS=DEFLATE -co TILED=YES "$WORK/dem.vrt" "$WORK/dem-region.tif"

      - name: Get coastline, lake and Natural Earth data
        if: ${{ !startsWith(inputs.rebuild, 'trails') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # These come from community servers that are sometimes down. Each copy that
          # downloads is also kept in the "planetiler-sources" release as a fallback.
          D="$WORK/planetiler-sources"; mkdir -p "$D"; cd "$D"
          R="${{ github.repository }}"
          gh release view planetiler-sources -R "$R" >/dev/null 2>&1 || \
            gh release create planetiler-sources -R "$R" --prerelease --title "Map build source data" \
              --notes "Fallback copies of the coastline, lake and Natural Earth files the topo build needs." || true
          get() {
            name="$1"; url="$2"
            if curl -fsSL --retry 3 --retry-delay 20 --connect-timeout 30 -o "$name.part" "$url"; then
              mv "$name.part" "$name"; echo "Downloaded $name"
              if ! gh release view planetiler-sources -R "$R" --json assets -q '.assets[].name' | grep -qx "$name"; then
                gh release upload planetiler-sources "$name" -R "$R" || true
              fi
              return 0
            fi
            rm -f "$name.part"
            echo "::warning::$url didn't download; using the saved copy."
            if gh release download planetiler-sources -R "$R" -p "$name" -D . --clobber; then return 0; fi
            # No saved copy yet: fetch it through the Cloudflare helper ("Online map server" workflow).
            echo "No saved copy; trying the Cloudflare helper."
            curl -fsSL --retry 3 --retry-delay 20 -o "$name.part" "https://trailguide-fetch.filleyn.workers.dev/$name"
            mv "$name.part" "$name"
            gh release upload planetiler-sources "$name" -R "$R" || true
          }
          get water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          get natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
          get lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/download/v12/lake_centerline.shp.zip
          ls -la

      - name: Build topo basemap (Planetiler)
        if: ${{ !startsWith(inputs.rebuild, 'trails') }}
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          java -Xmx${{ steps.region.outputs.java_heap }} -jar "$WORK/planetiler.jar" \
            --osm-path="$WORK/region.osm.pbf" \
            --output="$OUT/topo.pmtiles" \
            --bounds="${{ steps.region.outputs.bbox }}" \
            --maxzoom="${{ steps.region.outputs.max_zoom }}" \
            --download --download-dir="$WORK/planetiler-sources" \
            --tmpdir="$WORK/planetiler-tmp" --force

      - name: Build contours (40 ft, index every 200 ft)
        if: ${{ !startsWith(inputs.rebuild, 'trails') }}
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          # 40 ft is exactly 12.192 m, so contour the metre DEM and convert labels to feet.
          gdal_contour -q -a ele_m -i 12.192 "$WORK/dem-region.tif" "$WORK/contours.gpkg"
          ogr2ogr -f GeoJSONSeq "$WORK/contours.geojsonl" "$WORK/contours.gpkg" -t_srs EPSG:4326 -clipdst "$WORK/outline.geojson" \
            -dialect SQLITE \
            -sql "SELECT geom, CAST(ROUND(ele_m * 3.28084) AS INTEGER) AS ele_ft, CASE WHEN CAST(ROUND(ele_m * 3.28084) AS INTEGER) % 200 = 0 THEN 1 ELSE 0 END AS major FROM contour"
          tippecanoe -o "$OUT/contours.pmtiles" -l contours -Z10 -z"${{ steps.region.outputs.contour_max_zoom }}" \
            -j '{"contours":["any",[">=","$zoom",13],["==","major",1]]}' \
            --simplification=4 --drop-densest-as-needed --no-tile-size-limit \
            --attribution="Contours from USGS 3DEP" --name="TrailGuide contours" \
            --force "$WORK/contours.geojsonl"

      - name: Build terrain tiles (hillshade and elevation lookup)
        if: ${{ !startsWith(inputs.rebuild, 'trails') }}
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          python3 pipeline/terrain_rgb.py --dem "$WORK/dem-region.tif" \
            --bbox="${{ steps.region.outputs.bbox }}" \
            --minzoom 6 --maxzoom "${{ steps.region.outputs.terrain_max_zoom }}" \
            --clip "$WORK/outline.geojson" --out "$OUT/terrain.pmtiles"

      - name: Build water, trails, places and routing graph
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          python3 pipeline/build_osm_layers.py --pbf "$WORK/filtered.osm.pbf" \
            --bbox="${{ steps.region.outputs.bbox }}" --dem "$WORK/dem-region.tif" --out "$OUT" \
            --roads "${{ steps.region.outputs.roads }}"
          # Springs and places just over the border belong to the neighbouring state's maps.
          (cd pipeline && python3 clip_points.py --clip "$WORK/outline.geojson" "$OUT/water.geojson" "$OUT/pois.geojson")

      - name: Build online places layer and search file
        # For states you haven't downloaded: trailheads, campsites, water and a trail overview
        # streamed from the map server, and a small file to search the state by name.
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          python3 pipeline/build_online.py --dir "$OUT" --work "$WORK/online" | tee "$WORK/online-stats.json"
          echo "Online places layer and search file: $(cat "$WORK/online-stats.json")" >> "$GITHUB_STEP_SUMMARY"

      - name: Build slope shading
        if: ${{ !startsWith(inputs.rebuild, 'trails') }}
        continue-on-error: true
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          python3 pipeline/slope_tiles.py --dem "$WORK/dem-region.tif" --bbox="${{ steps.region.outputs.bbox }}" \
            --minzoom 10 --maxzoom 12 --clip "$WORK/outline.geojson" --out "$OUT/slope.pmtiles"

      - name: Build road access, rough roads and past burns
        if: ${{ !startsWith(inputs.rebuild, 'trails') }}
        continue-on-error: true
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          python3 pipeline/build_extras.py --bbox="${{ steps.region.outputs.bbox }}" --pbf "$WORK/filtered.osm.pbf" \
            --work "$WORK/extras" --out "$OUT/extras.pmtiles" --stats "$WORK/extras-stats.json" \
            --clip "$WORK/outline.geojson"

      - name: Build public land layer (PAD-US)
        if: ${{ !startsWith(inputs.rebuild, 'trails') }}
        # If the source is down the rest of the maps still publish; the app treats this file as optional.
        continue-on-error: true
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          python3 pipeline/build_publiclands.py --state "$(python3 -c "import json;print(json.load(open('pipeline/regions.json'))['$REGION'].get('state','OR'))")" \
            --work "$WORK/publiclands" --out "$OUT/publiclands.pmtiles" --stats "$WORK/publiclands-stats.json" \
            --max-zoom 12

      - name: Reuse unchanged map files from the last build
        if: ${{ startsWith(inputs.rebuild, 'trails') }}
        run: |
          # Only trails, water, places and routing were rebuilt; the map pictures are byte-for-byte
          # the same files, so the app's update downloads just what changed.
          prev=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            -q ".[] | select(.tag_name | test(\"^maps-${REGION}-[0-9]{4}-[0-9]{2}-[0-9]{2}-run[0-9]+$\")) | [.created_at, .tag_name] | @tsv" \
            | sort -r | head -1 | cut -f2)
          [ -n "$prev" ] || { echo "::error::No earlier ${REGION} map build to reuse. Run with 'everything'."; exit 1; }
          echo "Reusing map pictures from $prev"
          for f in topo contours terrain slope extras publiclands; do
            gh release download "$prev" -R "${{ github.repository }}" -p "$f.pmtiles" -D "$OUT" || echo "($f.pmtiles not in $prev)"
          done
          ls -la "$OUT"
          echo "Map pictures reused from $prev (trails, water, places and routing rebuilt)." >> "$GITHUB_STEP_SUMMARY"

      - name: Write manifest and check report
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          python3 pipeline/package.py --dir "$OUT" --region "$REGION" \
            --regions-file pipeline/regions.json --expect-trail "${{ steps.region.outputs.expect_trail }}" \
            --publiclands-stats "$WORK/publiclands-stats.json" --extras-stats "$WORK/extras-stats.json" \
            --summary "$WORK/summary.md"
          cat "$WORK/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        run: |
          exec > >(tee -a "$WORK/build.log") 2>&1
          # GitHub release files must be under 2 GB each.
          big=$(find "$OUT" -type f -size +2000M -printf "%f %s\n")
          if [ -n "$big" ]; then echo "::error title=File too large for a GitHub release::$big"; exit 1; fi
          ls -la "$OUT"
          TAG="maps-${REGION}-$(date -u +%Y-%m-%d)-run${{ github.run_number }}"
          gh release create "$TAG" "$OUT"/* \
            --title "Map files: ${REGION} ($(date -u +%Y-%m-%d))" \
            --notes-file "$WORK/summary.md"
          echo "Release: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Copy map files to Cloudflare (online map)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TRAILS_ONLY: ${{ startsWith(inputs.rebuild, 'trails') }}
        run: |
          # A trails-only build reused the other map files, which are already on Cloudflare.
          if [ "$TRAILS_ONLY" = "true" ]; then bash pipeline/r2_upload.sh "$REGION" "$OUT" places.pmtiles
          else bash pipeline/r2_upload.sh "$REGION" "$OUT"; fi

      - name: Remove old map releases (keep the newest 3)
        continue-on-error: true
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            -q '.[] | select(.tag_name | startswith("maps-'"$REGION"'-")) | [.created_at, .id, .tag_name] | @tsv' \
            | sort -r | tail -n +4 | while IFS=$'\t' read -r _ id tag; do
                echo "Deleting $tag"
                gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
                gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
              done

      - name: Report failure details
        if: failure()
        run: |
          tail -n 60 "$WORK/build.log" 2>/dev/null | sed 's/%/%25/g' > "$WORK/tail.txt" || true
          msg=$(awk '{printf "%s%%0A", $0}' "$WORK/tail.txt")
          echo "::error title=Last build output::${msg}"
