name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-app.yml"

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      LOG: ${{ github.workspace }}/build.log
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Bundle map label fonts
        run: |
          exec > >(tee -a "$LOG") 2>&1
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/protomaps/basemaps-assets.git "$RUNNER_TEMP/assets"
          git -C "$RUNNER_TEMP/assets" sparse-checkout set "fonts/Noto Sans Regular" "fonts/Noto Sans Medium" "fonts/Noto Sans Italic"
          for style in Regular Medium Italic; do
            dest="android/app/src/main/assets/fonts/NotoSans-$style"
            mkdir -p "$dest"
            for range in 0-255 256-511 8192-8447; do
              cp "$RUNNER_TEMP/assets/fonts/Noto Sans $style/$range.pbf" "$dest/"
            done
          done
          ls -R android/app/src/main/assets/fonts

      - name: Choose signing key
        env:
          KEYSTORE_B64: ${{ secrets.TRAILGUIDE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRAILGUIDE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/trailguide.jks"
            echo "TRAILGUIDE_KEYSTORE=$RUNNER_TEMP/trailguide.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "TRAILGUIDE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the private key from repository secrets."
          else
            echo "::error title=Signing key missing::Add the repository secrets TRAILGUIDE_KEYSTORE_B64 and TRAILGUIDE_KEYSTORE_PASSWORD (Settings, Secrets and variables, Actions), then run this workflow again."
            exit 1
          fi

      - name: Build APK
        working-directory: android
        run: |
          exec > >(tee -a "$LOG") 2>&1
          gradle --no-daemon assembleRelease
          gradle --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath | grep -m1 "org.maplibre.gl:android-sdk" || true

      - name: Publish release
        run: |
          VERSION="0.2.${{ github.run_number }}"
          APK="$RUNNER_TEMP/TrailGuideGPS-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          MAPLIBRE=$(grep -m1 -o "org.maplibre.gl:android-sdk:[^ ]*" "$LOG" | tail -1 || true)
          {
            echo "## TrailGuide GPS $VERSION"
            echo
            echo "Install on the Pixel: open this page on the phone, tap the .apk file below, and allow installs from your browser when asked."
            echo
            echo "Built from commit ${GITHUB_SHA::7}. ${MAPLIBRE}"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "app-v$VERSION" "$APK" --title "TrailGuide GPS $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "::notice::Published app-v$VERSION ($MAPLIBRE)"

      - name: Report failure details
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong|Could not|> " "$LOG" 2>/dev/null | head -40 | sed 's/%/%25/g' > "$RUNNER_TEMP/errs.txt" || true
          tail -n 30 "$LOG" 2>/dev/null | sed 's/%/%25/g' >> "$RUNNER_TEMP/errs.txt" || true
          msg=$(awk '{printf "%s%%0A", $0}' "$RUNNER_TEMP/errs.txt")
          echo "::error title=Build errors::${msg}"
