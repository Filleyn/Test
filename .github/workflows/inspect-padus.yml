name: Inspect public land data

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - name: Look at PAD-US for Oregon
        run: |
          {
            set -x
            pip install -q duckdb
            git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
            make -s -C /tmp/tippecanoe -j"$(nproc)" >/dev/null 2>&1 && sudo make -s -C /tmp/tippecanoe install >/dev/null 2>&1
            time python3 pipeline/build_publiclands.py --state OR --work /tmp/pad --out /tmp/publiclands.pmtiles --stats /tmp/pad-stats.json 2>&1 | grep -v "^ *[0-9.]*%" | tail -40
            ls -la /tmp/publiclands.pmtiles /tmp/pad
            head -c 3000 /tmp/pad-stats.json
            head -c 600 /tmp/pad/pad-labels.geojsonl
            set +x
          } > result.md 2>&1 || true
          cat result.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          text = open("result.md").read()
          chunks, cur = [], ""
          for line in text.splitlines(True):
              if len(cur) + len(line) > 3500:
                  chunks.append(cur); cur = ""
              cur += line
          chunks.append(cur)
          for i, c in enumerate(chunks[:9]):
              esc = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=Result part {i + 1:02d}::{esc}")
          PY
