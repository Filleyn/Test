name: Build Offer Scorer

on:
  workflow_dispatch:
  push:
    branches: [main, offerscorer]
    paths:
      - "offerscorer/**"
      - ".github/workflows/build-offerscorer.yml"

permissions:
  contents: write

concurrency:
  group: build-offerscorer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      LOG: ${{ github.workspace }}/build.log
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Same private key as TrailGuide GPS, so no new secrets are needed.
      - name: Choose signing key
        env:
          KEYSTORE_B64: ${{ secrets.TRAILGUIDE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRAILGUIDE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "OFFERSCORER_KEYSTORE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "OFFERSCORER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the private key from repository secrets."
          else
            echo "::error title=Signing key missing::Add the repository secrets TRAILGUIDE_KEYSTORE_B64 and TRAILGUIDE_KEYSTORE_PASSWORD (Settings, Secrets and variables, Actions), then run this workflow again."
            exit 1
          fi

      - name: Unit tests
        working-directory: offerscorer
        run: |
          exec > >(tee -a "$LOG") 2>&1
          gradle --no-daemon :app:testDebugUnitTest

      - name: Build APK
        working-directory: offerscorer
        run: |
          exec > >(tee -a "$LOG") 2>&1
          gradle --no-daemon assembleRelease

      - name: Publish release
        run: |
          NAME=$(grep -m1 -o 'versionName = "[^"]*"' offerscorer/app/build.gradle.kts | cut -d'"' -f2)
          VERSION="$NAME.${{ github.run_number }}"
          APK="$RUNNER_TEMP/OfferScorer-$VERSION.apk"
          cp offerscorer/app/build/outputs/apk/release/app-release.apk "$APK"
          {
            echo "## Offer Scorer $VERSION"
            echo
            echo "Install on the phone: open this page on the phone, tap the .apk file below, and allow installs from your browser when asked. It installs over the previous GitHub version and keeps your data."
            echo
            echo "If the app on the phone came from Android Studio, export your CSVs and uninstall it once first."
            echo
            echo "Built from commit ${GITHUB_SHA::7}."
          } > "$RUNNER_TEMP/notes.md"
          # --latest=false keeps the newest TrailGuide GPS release as the repo's "Latest".
          gh release create "offerscorer-v$VERSION" "$APK" --target "$GITHUB_SHA" --latest=false \
            --title "Offer Scorer $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "::notice::Published offerscorer-v$VERSION"

      - name: Report failure details
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong|Could not|> " "$LOG" 2>/dev/null | head -40 | sed 's/%/%25/g' > "$RUNNER_TEMP/errs.txt" || true
          tail -n 30 "$LOG" 2>/dev/null | sed 's/%/%25/g' >> "$RUNNER_TEMP/errs.txt" || true
          msg=$(awk '{printf "%s%%0A", $0}' "$RUNNER_TEMP/errs.txt")
          echo "::error title=Build errors::${msg}"
